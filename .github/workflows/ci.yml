name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Build and test server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The test suite patches functions with bou.ke/monkey, which needs
        # inlining disabled to find the functions it rewrites.
        run: go test -gcflags=-l -coverprofile=coverage.txt ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: ignore

  webapp:
    name: Lint webapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The webapp is still built by webpack 4, which needs the Node version
      # this plugin has always shipped with.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '14.21.3'
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install yarn
        run: npm install --global yarn

      - name: Lint
        run: make check-style-webapp

  lint:
    name: Lint server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
