name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The webapp bundle is still built by webpack 4, which needs the Node
      # version this plugin has always shipped with.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '14.21.3'

      - name: Install yarn
        run: npm install --global yarn

      - name: Test
        run: make test-server

      - name: Build bundles
        run: make dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
