version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace

  settings:
    govet:
      enable-all: true
    misspell:
      locale: US
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      confidence: 0

  exclusions:
    rules:
      - text: 'declaration of "(err|ctx)" shadows declaration at'
        linters:
          - govet
      # revive replaces golint, which was already dropped upstream, so this code
      # was never linted against these three rules. Tighten them in a dedicated
      # documentation pass instead of mixing it into a dependency refresh.
      - text: '^(exported|package-comments|unused-parameter):'
        linters:
          - revive
      # Quickfix-level switch suggestions in the large notification test file.
      - path: _test\.go
        text: 'QF100[23]:'
        linters:
          - staticcheck
      - path: server/standup/main.go
        linters:
          - govet
      - path: _test\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/standup-raven/standup-raven/server
